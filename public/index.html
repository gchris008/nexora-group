<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/webp" href="/favicon.webp?v=1">
<link rel="apple-touch-icon" href="/favicon.webp?v=1">
<title>NEXORA GROUP</title>
<meta name="description" content="NEXORA GROUP — commerce, distribution, technologie et expansion internationale.">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/" data-route="home"><img class="brand-logo" src="/nexora-logo.webp?v=4" alt="NEXORA GROUP"></a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème">☼ / ☾</button>
    <nav>
      <a href="/commerce" data-route="commerce">Commerce</a>
      <a href="/distribution" data-route="distribution">Distribution</a>
      <a href="/technologie" data-route="technologie">Technologie</a>
      <a href="/international" data-route="international">International</a>
      <a href="#contact" data-contact-link>Contact</a>
      <a href="/partenaires" data-route="partenaires">Partenaires</a>
      <a id="cartLink" class="cart-link" href="/checkout">Panier (0)</a>
      <div id="accountLinks" class="account-links"><a href="/connexion">Connexion</a><span aria-hidden="true"> / </span><a href="/inscription">Inscription</a></div>
    </nav>
  </div>
</header>

<main id="appView"></main>

<button id="floatingCart" class="floating-cart" type="button" aria-label="Ouvrir le panier"><span>🛒</span><b id="floatingCartCount">0</b></button>
<aside id="cartDrawer" class="cart-drawer" aria-hidden="true">
  <div class="cart-drawer-head"><div><span class="eyebrow">PANIER</span><h2>Votre panier</h2></div><button id="closeCart" class="drawer-close" type="button" aria-label="Fermer">×</button></div>
  <div id="drawerCartItems" class="drawer-cart-items"></div>
  <div class="drawer-cart-foot"><div class="cart-total"><span>Total</span><strong id="drawerCartTotal">0.00</strong></div><a class="btn gold" href="/checkout">Voir le panier et commander</a></div>
</aside>
<div id="cartBackdrop" class="cart-backdrop" hidden></div>

<footer><div class="wrap"><img class="footer-logo" src="/nexora-logo.webp?v=4" alt="NEXORA GROUP"><span>© 2026 — Tous droits réservés.</span></div></footer>
<script src="/site.js"></script>
</body>
</html>
