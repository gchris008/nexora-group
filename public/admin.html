<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — NEXORA GROUP</title><link rel="stylesheet" href="/admin.css"></head><body><main class="shell"><section id="loginView" class="card"><div class="mark">NG</div><h1>Administration NEXORA</h1><p>Accès privé sécurisé.</p><form id="login"><input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Se connecter</button><p id="loginMsg"></p></form></section><section id="appView" hidden><header class="top"><div><strong>NEXORA GROUP</strong><span id="who"></span></div><button id="logout">Se déconnecter</button></header><div class="tabs"><button data-tab="site">Site</button><button data-tab="products">Produits</button><button data-tab="messages">Messages</button><button data-tab="security">Sécurité</button><button data-tab="audit">Journal</button></div><section id="siteTab" class="card tab"><h2>Contenu du site</h2><form id="siteForm"><label>Nom<input id="company"></label><label>Slogan<input id="tagline"></label><label>Présentation<textarea id="hero"></textarea></label><label>E-mail de contact<input id="contactEmail" type="email"></label><button>Enregistrer</button><p id="siteMsg"></p></form></section><section id="productsTab" class="card tab" hidden><h2>Produits</h2><form id="productForm"><input id="pname" placeholder="Nom" required><input id="pprice" type="number" min="0" placeholder="Prix en centimes" required><input id="pcurrency" value="USD" maxlength="3" required><textarea id="pdesc" placeholder="Description"></textarea><button>Ajouter</button></form><div id="products"></div></section><section id="messagesTab" class="card tab" hidden><h2>Messages de contact</h2><div id="messages"></div></section><section id="securityTab" class="card tab" hidden><h2>Sécurité</h2><form id="passwordForm"><input id="currentPassword" type="password" placeholder="Mot de passe actuel" minlength="12" required><input id="newPassword" type="password" placeholder="Nouveau mot de passe" minlength="12" required><button>Modifier le mot de passe</button><p id="passwordMsg"></p></form></section><section id="auditTab" class="card tab" hidden><h2>Journal des activités</h2><div id="audit"></div></section></section></main><script src="/admin.js"></script></body></html>
