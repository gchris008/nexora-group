<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/webp" href="/favicon.webp?v=1"><link rel="apple-touch-icon" href="/favicon.webp?v=1"><title>Inscription — NEXORA GROUP</title><link rel="stylesheet" href="/admin.css"></head>
<body><main class="shell"><section class="card"><div class="top"><span></span><button type="button" class="theme-toggle" data-theme-toggle>☼ / ☾</button></div><img class="page-logo" src="/nexora-logo.webp?v=4" alt="NEXORA GROUP"><h1>Créer un compte</h1><p>Créez votre compte client NEXORA GROUP.</p><form id="register"><label class="field">Nom complet<input id="name" maxlength="120" placeholder="Ex. Jean DUPONT" autocomplete="name" required><small>Chaque mot doit commencer par une majuscule. Exemple : Jean Dupont.</small><span class="valid-icon" id="nameValid"></span></label><label class="field">Nom d’utilisateur<input id="username" maxlength="30" placeholder="Ex. jean.dupont" autocomplete="username" pattern="[A-Za-z0-9](?:[A-Za-z0-9._-]{2,29})" required><small>3 à 30 caractères : lettres, chiffres, point, tiret ou underscore. Sans espace.</small><span class="valid-icon" id="usernameValid"></span></label><label class="field">Adresse e-mail<input id="email" type="email" maxlength="160" placeholder="exemple@email.com" autocomplete="email" required><small>Utilisez une adresse e-mail valide.</small><span class="valid-icon" id="emailValid"></span></label><label class="field">Numéro de téléphone<input id="phone" type="tel" maxlength="12" value="+509" placeholder="+509XXXXXXXX" autocomplete="tel" required><small>Numéro haïtien obligatoire : +509 suivi de 8 chiffres. Exemple : +509XXXXXXXX.</small><span class="valid-icon" id="phoneValid"></span></label><label class="field">Mot de passe<input id="password" type="password" minlength="12" maxlength="200" placeholder="12 caractères minimum" autocomplete="new-password" required><small id="passwordHint">12 caractères minimum, avec majuscule, minuscule, chiffre et caractère spécial.</small><span class="valid-icon" id="passwordValid"></span></label><button id="registerButton">Créer mon compte</button><p id="msg"></p></form><section id="verificationBox" class="verify-box" hidden><h2>Vérifier votre e-mail</h2><p id="verificationText"></p><form id="verificationForm"><input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code reçu par e-mail" required><button>Vérifier l’e-mail</button><p id="verificationMsg"></p></form><button type="button" class="secondary-action" id="resendCode">Renvoyer le code</button></section><p><a href="/connexion">Connexion</a> · <a href="/">Retour au site</a></p></section></main><script src="/inscription.js"></script></body></html>
